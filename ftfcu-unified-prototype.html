<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>First Tech — Prototype Suite</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink-950:#0b1220; --ink-900:#111a2e; --ink-800:#1c2a45;
    --gray-200:#e2e5eb; --gray-400:#a3abbb; --gray-500:#7c869b;
    --ember-500:#da532c; --ember-600:#c1421e;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  body{
    position:relative;
    font-family:'Inter',system-ui,sans-serif;
    background:var(--ink-950);
  }
  .stage{ position:absolute; top:0; left:0; right:0; bottom:64px; background:#f7f8fa; transform:translateZ(0); }
  .frame-wrap{ position:absolute; inset:0; display:none; }
  .frame-wrap.active{ display:block; }
  iframe{ width:100%; height:100%; border:0; display:block; background:#fff; }

  .bottom-rail{
    position:fixed; left:0; right:0; bottom:0; z-index:100;
    display:flex; gap:4px;
    background:var(--ink-950);
    border-top:1px solid var(--ink-800);
    padding:8px 10px calc(8px + env(safe-area-inset-bottom));
    /* Isolate onto its own compositing layer — without this, a scrolled
       cross-origin (srcdoc) iframe adjacent to this element can produce a
       transient double-paint/"ghosting" artifact in Chromium's compositor
       during repaint, even though the DOM only ever has one rail element. */
    transform:translateZ(0);
    will-change:transform;
    backface-visibility:hidden;
    isolation:isolate;
  }
  .rail-btn{
    flex:1; display:flex; flex-direction:column; align-items:center; gap:4px;
    background:none; border:none; color:var(--gray-500);
    padding:8px 4px 7px; border-radius:10px; cursor:pointer;
    font-family:'JetBrains Mono',ui-monospace,monospace; font-size:10.5px; font-weight:500;
    transition:color .15s ease, background .15s ease;
  }
  .rail-btn svg{ width:20px; height:20px; }
  .rail-btn:hover:not(.active){ color:var(--gray-400); }
  .rail-btn.active{ color:#fff; background:rgba(255,255,255,0.10); }
  .rail-btn.active svg{ color:#fff; }
  .rail-label{ letter-spacing:.02em; }
</style>
</head>
<body>

<div class="stage">
  <div class="frame-wrap active" data-screen="homepage"><iframe id="frame-homepage" title="Homepage"></iframe></div>
  <div class="frame-wrap" data-screen="findmyfit"><iframe id="frame-findmyfit" title="Find My Fit"></iframe></div>
  <div class="frame-wrap" data-screen="banking"><iframe id="frame-banking" title="AI Banking Experience"></iframe></div>
</div>

<nav class="bottom-rail">
  <button class="rail-btn active" data-screen="homepage">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11.5L12 4l9 7.5"/><path d="M5 10v9a1 1 0 001 1h4v-6h4v6h4a1 1 0 001-1v-9"/></svg>
    <span class="rail-label">Homepage</span>
  </button>
  <button class="rail-btn" data-screen="findmyfit">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/><path d="M11 8v6M8 11h6"/></svg>
    <span class="rail-label">Find My Fit</span>
  </button>
  <button class="rail-btn" data-screen="banking">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="2" width="12" height="20" rx="2.5"/><path d="M10 18h4"/></svg>
    <span class="rail-label">AI Banking</span>
  </button>
</nav>

<script type="text/plain" id="src-homepage"><!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>First Tech — Homepage Experience Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    /* ---- FTFCU Design System tokens ---- */
    --ink:#0b1220;
    --bg:#f7f8fa;            /* Gray-50, surface-page */
    --bg-alt:#eef0f4;        /* Gray-100, surface-sunken */
    --panel:#ffffff;         /* Gray-0, surface-card */
    --teal:#2c3e5e;          /* Ink-700 — dark neutral accent (focus ring, checkbox) */
    --teal-deep:#111a2e;     /* Ink-900 — hero/dark surfaces */
    --teal-line:#e2e5eb;     /* Gray-200 */
    --gold:#da532c;          /* brand/CTA — Ember-500 */
    --gold-soft:#ef9d7c;     /* Ember-300 — pairs with Ember-50 bg */
    --gold-bg:#fdf1ec;       /* Ember-50 */
    --line:#e2e5eb;          /* Gray-200, border-subtle */
    --text:#0b1220;          /* text-primary */
    --text-muted:#5b6478;    /* Gray-600, text-secondary */
    --purple:#6a5de0;        /* Signal-500 — reserved for AI / North Star only */
    --radius:12px;
    --shadow:0 8px 24px rgba(11,18,32,.08), 0 2px 6px rgba(11,18,32,.05);
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  @media (prefers-reduced-motion: reduce){ html{scroll-behavior:auto;} *{transition:none !important; animation:none !important;} }

  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:'Inter', system-ui, sans-serif;
    font-size:16px;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.display{
    font-family:'Space Grotesk', Inter, system-ui, sans-serif;
    font-weight:600;
    letter-spacing:-0.02em;
    margin:0;
    color:var(--teal-deep);
  }
  a{color:inherit;}
  button{font-family:inherit;}
  :focus-visible{ outline:2px solid var(--teal); outline-offset:3px; }

  .wrap{max-width:1080px; margin:0 auto; padding:0 24px;}

  /* ---------- control bar ---------- */
  .control-bar{
    position:sticky; top:56px; z-index:40;
    background:rgba(247,248,250,0.92);
    backdrop-filter:blur(8px);
    border-bottom:1px solid var(--line);
  }
  .control-inner{
    display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between;
    gap:14px; padding:12px 24px;
  }
  .control-group{display:flex; align-items:center; gap:10px; flex-wrap:wrap;}
  .control-label{font-size:12.5px; color:var(--text-muted); white-space:nowrap;}
  .persona-set{display:flex; gap:6px; background:var(--bg-alt); border-radius:999px; padding:3px;}
  .persona-btn{
    border:none; background:transparent; padding:7px 14px; border-radius:999px;
    font-size:13.5px; font-weight:600; color:var(--text-muted); cursor:pointer;
  }
  .persona-btn[aria-pressed="true"]{ background:var(--teal-deep); color:#fff; }

  /* ---------- hero ---------- */
  .hero{ padding:72px 0 56px; position:relative; }
  .hero-card{
    background:var(--teal-deep); color:#f7f8fa; border-radius:22px;
    padding:52px 48px; position:relative; overflow:hidden;
  }
  .hero-card::before{
    content:""; position:absolute; inset:0;
    background:
      radial-gradient(520px 320px at 88% -10%, rgba(218,83,44,0.32), transparent 60%),
      radial-gradient(600px 400px at -10% 120%, rgba(44,62,94,0.55), transparent 60%);
    pointer-events:none;
  }
  .hero h1{ color:#ffffff; font-size:clamp(30px,4.4vw,46px); line-height:1.08; max-width:15ch; position:relative;}
  .hero p.lede{ color:rgba(255,255,255,.72); font-size:17px; max-width:46ch; margin-top:16px; position:relative;}
  .hero-ctas{ display:flex; gap:12px; margin-top:28px; flex-wrap:wrap; position:relative;}
  .btn{
    display:inline-flex; align-items:center; gap:8px; padding:12px 22px; border-radius:10px;
    font-weight:600; font-size:14.5px; cursor:pointer; border:1px solid transparent; text-decoration:none;
  }
  .btn-primary{ background:var(--gold); color:#ffffff; }
  .btn-primary:hover{ background:#c1421e; }
  .btn-ghost{ background:transparent; color:#f7f8fa; border-color:rgba(247,248,250,0.32); }
  .btn-ghost:hover{ border-color:#f7f8fa; }
  .hero-figure{
    position:relative; margin-top:32px; padding-top:24px; border-top:1px solid rgba(255,255,255,0.16);
    display:flex; gap:36px; flex-wrap:wrap;
  }
  .fig{ min-width:140px; }
  .fig .num{ font-family:'Space Grotesk', sans-serif; font-size:26px; font-weight:600; color:#f7f8fa; }
  .fig .lab{ font-size:12.5px; color:rgba(255,255,255,.55); margin-top:2px; }

  /* ---------- sections ---------- */
  section.block{ padding:56px 0; }
  .section-head{ display:flex; justify-content:space-between; align-items:flex-start; gap:16px; margin-bottom:22px;}
  .section-head h2{ font-size:30px; max-width:22ch; }
  .section-sub{ color:var(--text-muted); font-size:14.5px; max-width:52ch; margin-top:6px; }

  /* One Number module */
  .rate-card{
    background:var(--panel); border:1px solid var(--line); border-radius:var(--radius);
    box-shadow:var(--shadow); padding:36px; display:grid; grid-template-columns:1.1fr 1fr; gap:40px;
  }
  @media (max-width:820px){ .rate-card{ grid-template-columns:1fr; } }
  .rate-display .headline-rate{ font-family:'Space Grotesk', sans-serif; font-weight:600; font-size:52px; color:var(--teal-deep); line-height:1; }
  .rate-display .headline-rate small{ font-size:20px; font-style:normal; color:var(--text-muted); }
  .rate-display .rate-caption{ color:var(--text-muted); font-size:13.5px; margin-top:10px; max-width:34ch; }
  .payment-line{ margin-top:22px; padding-top:18px; border-top:1px dashed var(--line); }
  .payment-line .amount{ font-size:30px; font-weight:600; color:var(--teal-deep); }
  .payment-line .amount span{ font-size:15px; font-weight:500; color:var(--text-muted); }

  .control-panel label{ display:block; font-size:13px; font-weight:600; color:var(--ink); margin-bottom:6px; }
  .control-row{ margin-bottom:20px; }
  .product-toggle{ display:flex; gap:8px; margin-bottom:20px; }
  .seg-btn{
    flex:1; border:1px solid var(--line); background:var(--bg); padding:9px 6px; border-radius:9px;
    font-size:13px; font-weight:600; color:var(--text-muted); cursor:pointer;
  }
  .seg-btn[aria-pressed="true"]{ background:var(--teal-deep); color:#fff; border-color:var(--teal-deep); }
  input[type="range"]{ width:100%; accent-color:var(--teal); }
  .range-value{ display:flex; justify-content:space-between; font-size:13px; color:var(--text-muted); margin-top:4px; }
  .checkbox-row{ display:flex; align-items:center; gap:10px; font-size:13.5px; color:var(--ink); font-weight:500; }
  .checkbox-row input{ width:16px; height:16px; accent-color:var(--teal); }
  .rate-fineprint{ font-size:11.5px; color:#7c869b; margin-top:18px; }

  .btn-dark{ background:var(--teal-deep); color:#fff; }
  .btn-dark:hover{ background:#0b1220; }

  /* Mortgage rate mini-stats (used in merged Talk-to-a-Person section) */
  .rate-mini-row{ display:flex; gap:28px; margin:20px 0; flex-wrap:wrap; }
  .rate-mini .val{ font-family:'Space Grotesk', sans-serif; font-weight:600; font-size:24px; color:var(--teal-deep); }
  .rate-mini .lab{ font-size:12.5px; color:var(--text-muted); }

  /* Trust band */
  .trust-band{
    background:var(--bg-alt); border-radius:var(--radius); border:1px solid var(--line);
    padding:32px 36px;
  }
  .trust-band h3{ font-size:19px; }
  .trust-facts{ display:grid; grid-template-columns:repeat(2,1fr); gap:20px; margin-top:20px; }
  @media (max-width:720px){ .trust-facts{ grid-template-columns:1fr; } }
  .trust-fact .k{ font-weight:600; color:var(--teal-deep); font-size:14.5px; }
  .trust-fact .v{ color:var(--text-muted); font-size:13.5px; margin-top:3px; }

  footer.legal{ text-align:center; padding:24px; font-size:12px; color:#a3abbb; }

  /* ---------- site header (matches Find My Fit) ---------- */
  .site-header{
    background:#fff; border-bottom:1px solid #e2e5eb; box-shadow:0 1px 4px rgba(0,0,0,0.05);
    position:sticky; top:0; z-index:50;
  }
  .site-header-inner{ padding:0 40px; display:flex; align-items:center; gap:28px; height:56px; }
  .site-nav{ display:flex; align-items:center; gap:32px; flex:1; }
  .site-nav span{ color:#0b1220; font-size:15px; cursor:pointer; white-space:nowrap; }
  .site-header-actions{ display:flex; align-items:center; gap:20px; }
  .site-header-actions .login-link{ color:#0b1220; font-size:15px; cursor:pointer; white-space:nowrap; }
  .join-btn{
    background:var(--gold); border:none; border-radius:24px; padding:8px 22px;
    color:#fff; font-size:14px; font-weight:600; cursor:pointer; white-space:nowrap;
  }

  /* ---------- Find My Fit module ---------- */
  .findfit-module{
    background:var(--teal-deep); border-radius:22px; padding:40px 44px;
    display:flex; align-items:center; justify-content:space-between; gap:32px; flex-wrap:wrap;
    position:relative; overflow:hidden;
  }
  .findfit-module::before{
    content:""; position:absolute; inset:0;
    background:radial-gradient(420px 260px at 90% 110%, rgba(218,83,44,0.28), transparent 60%);
    pointer-events:none;
  }
  .findfit-copy{ max-width:56ch; position:relative; }
  .findfit-kicker{ font-size:12px; font-weight:700; letter-spacing:.04em; color:rgba(255,255,255,.55); }
  .findfit-copy h2{ color:#fff; font-size:26px; margin-top:8px; }
  .findfit-copy p{ color:rgba(255,255,255,.68); font-size:14.5px; margin-top:10px; }
  .findfit-module .btn-primary{ position:relative; flex:none; border:none; }

  /* ---------- Money Coach (persistent, AI — Signal purple) ---------- */
  .mc-fab{
    position:fixed; bottom:24px; right:24px; z-index:200;
    background:#fff; border:1px solid var(--line); border-radius:999px; padding:11px 18px 11px 12px;
    display:flex; align-items:center; gap:9px; box-shadow:0 10px 28px rgba(11,18,32,.22); cursor:pointer;
  }
  .mc-fab-icon{
    width:28px;height:28px;border-radius:50%;
    background:linear-gradient(135deg,#6a5de0,#a9a3f2);
    color:#fff; display:flex;align-items:center;justify-content:center; font-size:13px;
    animation:pulseGlow 2.4s ease-in-out infinite;
  }
  .mc-fab-label{ font-size:13px; font-weight:700; color:var(--teal-deep); }
  .mc-panel{
    position:fixed; bottom:90px; right:24px; width:380px; max-width:calc(100vw - 32px);
    height:520px; max-height:calc(100vh - 140px);
    background:rgba(255,255,255,.86); backdrop-filter:blur(20px) saturate(160%); -webkit-backdrop-filter:blur(20px) saturate(160%); border-radius:22px; border:1px solid rgba(255,255,255,.5);
    box-shadow:0 30px 70px rgba(11,18,32,.4); z-index:200;
    flex-direction:column; overflow:hidden;
  }
  .mc-head{ display:flex; align-items:center; justify-content:space-between; padding:14px 16px; border-bottom:1px solid var(--line); }
  .mc-head-left{ display:flex; align-items:center; gap:10px; }
  .mc-avatar{ width:34px;height:34px;border-radius:50%; background:linear-gradient(135deg,#6a5de0,#a9a3f2); color:#fff; display:flex;align-items:center;justify-content:center; font-size:14px; flex-shrink:0;}
  .mc-title{ font-weight:700; font-size:14px; color:var(--teal-deep); }
  .mc-sub{ font-size:11px; color:var(--text-muted); }
  .mc-close{ background:var(--bg-alt); border:none; width:26px;height:26px; border-radius:50%; cursor:pointer; color:var(--teal-deep); flex-shrink:0; }
  .mc-body{ flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:10px; }
  .mc-intro{ text-align:center; padding:12px 4px; }
  .mc-intro-title{ font-weight:700; font-size:15px; color:var(--teal-deep); margin-bottom:4px; }
  .mc-intro-sub{ font-size:12.5px; color:var(--text-muted); margin-bottom:14px; }
  .mc-suggest{
    display:block; width:100%; text-align:left; padding:10px 13px; margin-bottom:8px;
    background:var(--bg-alt); border:1px solid var(--line); border-radius:12px;
    font-size:12.5px; font-weight:600; color:var(--teal-deep); cursor:pointer;
  }
  .mc-suggest:hover{ background:#e3e1fb; }
  .mc-msg{ max-width:82%; padding:10px 13px; border-radius:16px; font-size:13px; line-height:1.45; }
  .mc-msg.user{ align-self:flex-end; background:var(--teal-deep); color:#fff; border-bottom-right-radius:4px; }
  .mc-msg.bot{ align-self:flex-start; background:#e3e1fb; color:var(--teal-deep); border-bottom-left-radius:4px; }
  .mc-input-row{ padding:12px 14px; border-top:1px solid var(--line); display:flex; gap:8px; }
  .mc-input{ flex:1; padding:11px 15px; border-radius:99px; border:1px solid var(--line); background:var(--bg); font-size:13px; font-family:inherit; outline:none; }
  .mc-input:focus{ border-color:#6a5de0; }
  .mc-send{ width:38px;height:38px;border-radius:50%; border:none; background:#6a5de0; color:#fff; cursor:pointer; flex-shrink:0; }
  .mc-disclaimer{ font-size:10px; color:#a3abbb; text-align:center; padding:0 16px 10px; }
  @media (max-width:480px){ .mc-panel{ right:16px; left:16px; width:auto; bottom:84px; } .mc-fab{ right:16px; } }
  @keyframes meshDrift{0%,100%{transform:translate(0,0) scale(1);}50%{transform:translate(-2%,3%) scale(1.06);}}
  .hero-card::after{content:"";position:absolute;inset:-15%;background:radial-gradient(460px 300px at 15% 15%,rgba(106,93,224,0.16),transparent 60%);animation:meshDrift 16s ease-in-out infinite;pointer-events:none;}
  .offer-tile,.rate-card{transition:transform .25s cubic-bezier(.4,0,.2,1),box-shadow .25s cubic-bezier(.4,0,.2,1);}
  .offer-tile:hover{transform:translateY(-4px);box-shadow:0 18px 36px rgba(11,18,32,.14);}
  @keyframes pulseGlow{0%{box-shadow:0 0 0 0 rgba(106,93,224,.45);}70%{box-shadow:0 0 0 12px rgba(106,93,224,0);}100%{box-shadow:0 0 0 0 rgba(106,93,224,0);}}
  .mc-fab{transition:transform .2s ease;}
  .mc-fab:hover{transform:translateY(-2px);}
  .mc-msg.bot.typing{display:flex;gap:5px;align-items:center;padding:12px 16px;}
  .typing-dot{width:6px;height:6px;border-radius:50%;background:var(--purple);opacity:.4;animation:typingBounce 1.1s infinite;}
  .typing-dot:nth-child(2){animation-delay:.15s}
  .typing-dot:nth-child(3){animation-delay:.3s}
  /* ---------- Offer grid (SoFi-style comprehensive product tiles) ---------- */
  .offer-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:16px; }
  @media (max-width:820px){ .offer-grid{ grid-template-columns:1fr 1fr; } }
  @media (max-width:520px){ .offer-grid{ grid-template-columns:1fr; } }
  .offer-tile{
    background:var(--panel); border:1px solid var(--line); border-radius:14px;
    padding:20px; display:flex; flex-direction:column; gap:4px;
  }
  .offer-icon{
    width:38px; height:38px; border-radius:10px; background:var(--bg-alt);
    display:flex; align-items:center; justify-content:center; margin-bottom:8px;
    font-size:18px;
  }
  .offer-kicker{ font-size:10.5px; font-weight:700; letter-spacing:.04em; color:var(--text-muted); text-transform:uppercase; }
  .offer-title{ font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:16px; color:var(--teal-deep); margin-top:2px; }
  .offer-desc{ font-size:13px; color:var(--text-muted); line-height:1.45; margin-top:2px; flex:1; }
  .offer-link{ font-size:13px; font-weight:600; color:var(--gold); margin-top:10px; text-decoration:none; }
  .offer-link:hover{ text-decoration:underline; }

  /* ---------- Benefit list (softened "why us", SoFi-style, led by bold stat) ---------- */
  .benefit-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:32px; text-align:center; }
  @media (max-width:820px){ .benefit-grid{ grid-template-columns:1fr; } }
  .benefit-item{ display:flex; flex-direction:column; align-items:center; gap:6px; }
  .benefit-num{ font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:34px; color:var(--gold); line-height:1; margin-bottom:4px; }
  .benefit-title{ font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:16px; color:var(--teal-deep); }
  .benefit-desc{ font-size:13.5px; color:var(--text-muted); line-height:1.55; max-width:32ch; }

  /* ---------- Ongoing product value (lighter strip within Why First Tech) ---------- */
  .ongoing-value{ margin-top:40px; padding-top:32px; border-top:1px solid var(--line); }
  .ongoing-value-head{ text-align:center; font-size:13px; font-weight:600; color:var(--text-muted); margin-bottom:24px; }
  .ongoing-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:24px; }
  @media (max-width:820px){ .ongoing-grid{ grid-template-columns:1fr; } }
  .ongoing-item{ display:flex; flex-direction:column; gap:4px; }
  .ongoing-icon{ color:#6a5de0; font-size:16px; font-weight:700; margin-bottom:2px; }
  .ongoing-title{ font-size:14px; font-weight:600; color:var(--teal-deep); }
  .ongoing-desc{ font-size:12.5px; color:var(--text-muted); line-height:1.5; }

  /* ---------- Advisor near you ---------- */

<script>
  // ---------- persona / recognition layer ----------
  const personas = {
    anon: {
      headline: "Banking that's actually yours.",
      lede: "See what First Tech members are earning, saving, and financing right now — no login required.",
      cta: "See today's rates"
    },
    priya: {
      headline: "Your auto loan quote is ready.",

    },

      headline: "Your membership just got a lot bigger.",
      lede: "DCU is now part of First Tech — same account, same routing number, plus nationwide branches and rates DCU didn't have before.",

    },
    newmember: {
      headline: "You're 30 days into membership. Let's get you set up.",
      lede: "Members who add Rewards Checking in their first 90 days earn up to 3.00% APY on savings and get $10/month in ATM fees back — on top of your auto loan.",
      cta: "Open Rewards Checking"

  };

  const personaBtns = document.querySelectorAll(".persona-btn");

  function applyPersona(key){

    personaBtns.forEach(b => b.setAttribute("aria-pressed", b.dataset.persona === key ? "true" : "false"));
  }

  personaBtns.forEach(btn => btn.addEventListener("click", () => applyPersona(btn.dataset.persona)));
  applyPersona("anon");

  // ---------- Talk to a person (region + advisor-type simulate) ----------
  const REGIONS = {
    west: {
      desc: "First Tech's largest branch network is in Oregon, with additional locations in Washington, California, Colorado, Idaho, and Texas.",
      regionName: "Pacific Northwest",
      regionDesc: "Oregon · Washington · California · Colorado · Idaho · Texas"
    },
    east: {
      desc: "DCU's branch network covers Massachusetts and New Hampshire — now backed by First Tech's nationwide membership.",
      regionName: "New England",
      regionDesc: "Massachusetts · New Hampshire"
    }
  };
  const ADVISOR_TYPES = {
    general: { headline: "Talk to an advisor at a branch near you.", cta: "Book an appointment", showRates: false },
    mortgage: { headline: "Talk to a mortgage advisor.", cta: "Book a mortgage consult", showRates: true }
  };
  let currentRegion = "west";
  let currentAdvisorType = "general";
  const regionBtns = document.querySelectorAll(".region-btn");
  const advisorTypeBtns = document.querySelectorAll(".advisor-type-btn");

  function renderAdvisor(){
    const r = REGIONS[currentRegion];
    const t = ADVISOR_TYPES[currentAdvisorType];
    document.getElementById("advisorHeadline").textContent = t.headline;
    document.getElementById("advisorDesc").textContent = r.desc;
    document.getElementById("advisorCta").textContent = t.cta;
    document.getElementById("mortgageRates").style.display = t.showRates ? "flex" : "none";
    document.getElementById("advisorRegionName").textContent = r.regionName;
    document.getElementById("advisorRegionDesc").textContent = r.regionDesc;
    regionBtns.forEach(b => b.setAttribute("aria-pressed", b.dataset.region === currentRegion ? "true" : "false"));
    advisorTypeBtns.forEach(b => b.setAttribute("aria-pressed", b.dataset.type === currentAdvisorType ? "true" : "false"));
  }
  regionBtns.forEach(btn => btn.addEventListener("click", () => { currentRegion = btn.dataset.region; renderAdvisor(); }));
  advisorTypeBtns.forEach(btn => btn.addEventListener("click", () => { currentAdvisorType = btn.dataset.type; renderAdvisor(); }));
  renderAdvisor();

  (function countUpFigures(){
    document.querySelectorAll('.hero-figure .num').forEach(el=>{
      const m = el.textContent.match(/([\d.]+)/);
      if(!m) return;
      const target = parseFloat(m[1]);
      const decimals = m[1].includes('.') ? m[1].split('.')[1].length : 0;
      const after = el.textContent.slice(el.textContent.indexOf(m[1]) + m[1].length);
      const start = performance.now(), dur = 900;
      function tick(now){
        const p = Math.min(1, (now-start)/dur);
        const eased = 1 - Math.pow(1-p, 3);
        el.textContent = (target*eased).toFixed(decimals) + after;
        if(p<1) requestAnimationFrame(tick);
      }
      requestAnimationFrame(tick);
    });
  })();

  // ---------- One Number calculator ----------
  const rates = {
    new:  { apr: 8.32, caption: "Illustrative example for an 84-month term, new vehicle. Your actual rate depends on state, term, and credit tier." },
    used: { apr: 8.70, caption: "Illustrative example for an 84-month term, used vehicle. Your actual rate depends on state, term, and credit tier." },
    refi: { apr: 6.25, caption: "Illustrative refinance example. Your actual rate depends on your current loan balance, term, and credit tier." }
  };
  let currentProduct = "new";
  const loanAmountEl = document.getElementById("loanAmount");
  const loanTermEl = document.getElementById("loanTerm");
  const discountEl = document.getElementById("relationshipDiscount");

  function recalc(){
    const base = rates[currentProduct];
    const apr = discountEl.checked ? Math.max(base.apr - 0.50, 0) : base.apr;
    const amount = parseInt(loanAmountEl.value, 10);
    const term = parseInt(loanTermEl.value, 10);
    const monthlyRate = (apr / 100) / 12;
    const payment = monthlyRate === 0
      ? amount / term
      : (amount * monthlyRate * Math.pow(1 + monthlyRate, term)) / (Math.pow(1 + monthlyRate, term) - 1);

    document.getElementById("rateValue").textContent = apr.toFixed(2);
    document.getElementById("rateCaption").textContent = base.caption;
    document.getElementById("paymentValue").textContent = "$" + Math.round(payment).toLocaleString();
    document.getElementById("loanAmountLabel").textContent = "$" + amount.toLocaleString();
    document.getElementById("loanTermLabel").textContent = term + " mo";
  }

  document.querySelectorAll(".seg-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      document.querySelectorAll(".seg-btn").forEach(b => b.setAttribute("aria-pressed", "false"));
      btn.setAttribute("aria-pressed", "true");
      currentProduct = btn.dataset.product;
      recalc();
    });
  });
  [loanAmountEl, loanTermEl, discountEl].forEach(el => el.addEventListener("input", recalc));
  recalc();

  // ---------- Find My Fit CTA — hands off to the parent viewer, if present ----------
  document.getElementById("findMyFitCta").addEventListener("click", () => {
    if (window.parent !== window) {
      window.parent.postMessage({ type: "switchScreen", screen: "findmyfit" }, "*");
    }
  });

  // ---------- Money Coach (pre-login, general guidance only) ----------
  (function(){
    const fab = document.getElementById("mcFab");
    const panel = document.getElementById("mcPanel");
    const closeBtn = document.getElementById("mcClose");
    const body = document.getElementById("mcBody");
    const input = document.getElementById("mcInput");
    const sendBtn = document.getElementById("mcSend");

    function toggle(open){ panel.style.display = open ? "flex" : "none"; }
    fab.addEventListener("click", () => toggle(true));
    closeBtn.addEventListener("click", () => toggle(false));

    function reply(q){
      const s = q.toLowerCase();
      if(s.includes("home") || s.includes("mortgage")) return "First Tech's fixed home equity rates start at 5.117% (5-year term), and a mortgage advisor can lock your rate while you shop — no cost to check.";
      if(s.includes("auto") || s.includes("car")) return "New auto rates start around 8.32% APR, with a 0.50% relationship discount if you already bank here. Refinancing an existing loan is often worth checking too — as low as 6.25% APR.";
      if(s.includes("certificate") || s.includes("savings")) return "A Certificate locks in a fixed rate for a set term (roughly 2.86%–3.44% APY depending on term) — good for money you won't need soon. Rewards Savings stays liquid and can earn up to 3.00% APY once your linked checking qualifies.";
      if(s.includes("credit") || s.includes("card")) return "Odyssey Rewards World Elite earns 2X points on dining and travel. If you're building credit from scratch, the Platinum Secured card is designed for exactly that.";
      return "Happy to help — I can walk through checking, savings, loans, or credit cards. What would be most useful to look at first?";
    }

    function addMsg(role, text){
      const div = document.createElement("div");
      div.className = "mc-msg " + role;
      div.textContent = text;
      body.appendChild(div);
      body.scrollTop = body.scrollHeight;
    }

    function addTyping(){
      const div = document.createElement("div");
      div.className = "mc-msg bot typing";
      div.id = "mcTyping";
      div.innerHTML = '<span class="typing-dot"></span><span class="typing-dot"></span><span class="typing-dot"></span>';
      body.appendChild(div);
      body.scrollTop = body.scrollHeight;
    }
    function send(q){
      if(!q.trim()) return;
      const intro = body.querySelector(".mc-intro");
      if(intro) intro.remove();
      addMsg("user", q);
      input.value = "";
      addTyping();
      setTimeout(() => { const t=document.getElementById("mcTyping"); if(t) t.remove(); addMsg("bot", reply(q)); }, 650);
    }

    sendBtn.addEventListener("click", () => send(input.value));
    input.addEventListener("keydown", e => { if(e.key === "Enter") send(input.value); });
    document.querySelectorAll(".mc-suggest").forEach(btn => {
      btn.addEventListener("click", () => send(btn.dataset.q));
    });
  })();

  // ---------- Same-page anchor scrolling (manual, not a native fragment nav) ----------
  // A native href="#id" navigation inside a srcdoc iframe can trigger a
  // transient Chromium compositor artifact in the parent document (a
  // "ghosted" duplicate paint of fixed-position siblings, e.g. the viewer's
  // bottom rail) even though the DOM itself never changes. Scrolling manually
  // sidesteps the same-document navigation entirely.
  document.querySelectorAll('a[href^="#"]').forEach(a => {
    a.addEventListener('click', e => {
      const id = a.getAttribute('href').slice(1);
      const target = id && document.getElementById(id);
      if(target){
        e.preventDefault();
        target.scrollIntoView({ behavior: 'smooth', block: 'start' });
      }
    });
  });

  if(allOpened) return (
    <div style={{position:"sticky",bottom:0,background:"white",borderTop:"1px solid #e2e5eb",padding:"16px 32px",display:"flex",alignItems:"center",gap:16,boxShadow:"0 -4px 20px rgba(0,0,0,0.08)",zIndex:30}}>

          <input type="tel" value={lead.phone} onChange={e=>onChange("phone",e.target.value)} placeholder="(555) 123-4567"
            style={{width:"100%",border:"1.5px solid #cbd1db",borderRadius:12,padding:"13px 16px",fontSize:14.5,fontFamily:"inherit",color:"#0b1220",background:"white"}}/>
        </div>
      </div>
      {error&&<div style={{color:R,fontSize:13,marginTop:12}}>{error}</div>}
      <button onClick={onSubmit} disabled={!valid} style={{width:"100%",marginTop:22,background:valid?R:"#cbd1db",color:"white",border:"none",borderRadius:28,padding:"16px 24px",fontSize:16,fontWeight:600,cursor:valid?"pointer":"not-allowed",boxShadow:valid?"0 4px 20px rgba(218,83,44,0.3)":"none",transition:"all 0.2s"}}>See my results →</button>
      <div style={{textAlign:"center",marginTop:12,fontSize:12,color:"#a3abbb"}}>Membership eligibility required. We'll never sell your information.</div>
    </div>
  );
};

const Results = ({data,onReset}) => {
  const [selectedIds,setSelectedIds] = React.useState(new Set());
  const [openedIds,setOpenedIds]     = React.useState(new Set());
  const toggle = (i) => { if(openedIds.has(i))return; setSelectedIds(prev=>{const n=new Set(prev);n.has(i)?n.delete(i):n.add(i);return n;}); };
  const openSelected = () => {setOpenedIds(prev=>new Set([...prev,...selectedIds]));setSelectedIds(new Set());};
  return (
    <div style={{paddingBottom:90}}>
      <div style={{maxWidth:960,margin:"0 auto",padding:"40px 24px 0"}}>
        <div style={{background:`linear-gradient(135deg,rgba(11,18,32,0.97),rgba(28,42,69,0.92))`,borderRadius:14,padding:"24px 32px",marginBottom:32,border:"1px solid rgba(255,255,255,0.08)",boxShadow:"0 8px 32px rgba(0,0,0,0.15)"}}>
          <div style={{display:"flex",alignItems:"flex-start",justifyContent:"space-between",gap:24}}>
            <div style={{flex:1}}>
              <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:10}}>
                <span style={{fontSize:10,fontWeight:700,letterSpacing:"0.1em",textTransform:"uppercase",color:"rgba(255,255,255,0.45)"}}>Your Member Profile</span>
                <span style={{background:R,color:"white",fontSize:11,fontWeight:700,padding:"3px 10px",borderRadius:12}}>{data.memberType}</span>
              </div>
              <div style={{fontSize:16,color:"rgba(255,255,255,0.85)",lineHeight:1.5,marginBottom:8}}>{data.profileSummary}</div>
              <div style={{fontSize:13,color:"rgba(255,255,255,0.45)"}}>{data.nextStep}</div>
            </div>
            <div style={{flexShrink:0}}>
              <div style={{background:"rgba(255,255,255,0.07)",border:"1px solid rgba(255,255,255,0.1)",borderRadius:10,padding:"16px 24px",textAlign:"right"}}>
                <div style={{fontSize:36,fontWeight:600,color:"white",letterSpacing:"-0.025em",lineHeight:1,fontFamily:"'Space Grotesk',sans-serif"}}>${(data.totalBenefit||0).toLocaleString()}</div>
                <div style={{fontSize:10,fontWeight:700,letterSpacing:"0.1em",textTransform:"uppercase",color:"rgba(255,255,255,0.4)",marginTop:4}}>Est. Annual Benefit</div>
              </div>
            </div>
          </div>
        </div>
        {data._quiz && (data._quiz.membershipLabel || data._quiz.followupLabel) && (
          <div style={{display:"flex",alignItems:"center",gap:8,flexWrap:"wrap",marginBottom:20}}>
            <span style={{fontSize:10,fontWeight:700,letterSpacing:"0.1em",textTransform:"uppercase",color:"#a3abbb"}}>Based on what you told us</span>
            {data._quiz.membershipLabel && <span style={{background:"#eef0f4",color:"#414a5c",fontSize:12,fontWeight:600,padding:"4px 11px",borderRadius:99}}>{data._quiz.membershipLabel}</span>}
            {data._quiz.followupLabel && <span style={{background:"#eef0f4",color:"#414a5c",fontSize:12,fontWeight:600,padding:"4px 11px",borderRadius:99}}>{data._quiz.followupLabel}</span>}
          </div>
        )}
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:16}}>
          <div>
            <div style={{fontSize:10,fontWeight:700,letterSpacing:"0.1em",textTransform:"uppercase",color:"#a3abbb",marginBottom:3}}>Recommended for You</div>
            <div style={{fontSize:13,color:"#7c869b"}}>Select the accounts you'd like to open, or talk to a real person.</div>
          </div>
          {selectedIds.size>0&&<div style={{background:`${R}10`,border:`1px solid ${R}30`,borderRadius:20,padding:"5px 14px",fontSize:12,fontWeight:600,color:R}}>{selectedIds.size} selected · ${data.products.filter((_,i)=>selectedIds.has(i)).reduce((s,p)=>s+(p.dollarAmount||0),0).toLocaleString()}/yr</div>}
        </div>
        <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gridTemplateRows:"repeat(7,auto)",gap:"0 16px",marginBottom:24}}>
          {data.products.slice(0,3).map((p,i)=><ProductCard key={i} idx={i} p={p} selected={selectedIds.has(i)} opened={openedIds.has(i)} onToggle={()=>toggle(i)}/>)}
        </div>
        <div style={{marginBottom:14,padding:"16px 20px",background:"#f7f8fa",borderRadius:10,border:"1px solid #e2e5eb"}}>
          <div style={{fontSize:10,fontWeight:700,letterSpacing:"0.1em",textTransform:"uppercase",color:"#a3abbb",marginBottom:6}}>How We Calculated Your Benefit</div>
          <div style={{fontSize:13,color:"#5b6478",lineHeight:1.6}}>{data.benefitExplanation}</div>
        </div>
        <div style={{marginBottom:16,padding:"16px 20px",background:"#eaf3fb",borderRadius:10,border:"1px solid #93c1e8",display:"flex",gap:12,alignItems:"flex-start"}}>
          <div style={{width:28,height:28,borderRadius:"50%",background:N,display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}><span style={{color:"white",fontSize:13}}>i</span></div>
          <div><div style={{fontSize:10,fontWeight:700,letterSpacing:"0.1em",textTransform:"uppercase",color:N,marginBottom:4}}>Advisor Tip</div><div style={{fontSize:13,color:"#414a5c",lineHeight:1.6}}>{data.advisorTip}</div></div>
        </div>
        <div style={{fontSize:11,color:"#a3abbb",lineHeight:1.6,textAlign:"center",paddingBottom:8}}>Illustrative estimates for design purposes only — see firsttechfed.com for current rates and terms. Membership eligibility required. Federally insured by NCUA. © 2026 First Tech Federal Credit Union.</div>
      </div>
      <CTABar selectedIds={selectedIds} products={data.products} openedIds={openedIds} onOpenSelected={openSelected} onReset={onReset} lead={data._lead}/>
    </div>
  );
};

function App() {
  const [selected,setSelected] = React.useState(null);
  const [text,setText]         = React.useState("");
  const [phase,setPhase]       = React.useState("home"); // home/quiz/lead/loading/results
  const [result,setResult]     = React.useState(null);
  const [error,setError]       = React.useState(null);
  const [quizStep,setQuizStep] = React.useState(1);
  const [quizAnswers,setQuizAnswers] = React.useState({membership:null,membershipLabel:null,followup:null,followupLabel:null});
  const [lead,setLead]         = React.useState({name:"",email:"",phone:""});
  const [leadError,setLeadError] = React.useState(null);

  const handleSelect = (id) => {setSelected(id);setText(PREFILLS[id]||"");};

  const goHome = () => {
    setPhase("home");setResult(null);setSelected(null);setText("");setError(null);
    setQuizStep(1);setQuizAnswers({membership:null,membershipLabel:null,followup:null,followupLabel:null});
    setLead({name:"",email:"",phone:""});setLeadError(null);
  };

  const startQuiz = () => {
    if(!text.trim()) return;
    setQuizAnswers({membership:null,membershipLabel:null,followup:null,followupLabel:null});
    setQuizStep(1);
    setPhase("quiz");
  };

  const quizBack = () => {
    if(quizStep === 2){ setQuizStep(1); }
    else { setPhase("home"); }
  };

  const leadBack = () => { setPhase("quiz"); setQuizStep(2); };

  const handleQuizAnswer = (key, id, label) => {
    const updated = {...quizAnswers, [key]: id, [key + "Label"]: label};
    setQuizAnswers(updated);
    if(quizStep === 1){ setQuizStep(2); }
    else { setPhase("lead"); }
  };

  const handleLeadChange = (field, value) => { setLeadError(null); setLead(prev => ({...prev, [field]: value})); };

  const handleLeadSubmit = () => {
    if(lead.name.trim().length<2){ setLeadError("Please enter your full name."); return; }
    if(!/\S+@\S+\.\S+/.test(lead.email)){ setLeadError("Please enter a valid email address."); return; }
    if(lead.phone.replace(/\D/g,"").length<10){ setLeadError("Please enter a valid phone number."); return; }
    handleSubmit(quizAnswers);
  };

  const handleSubmit = async (finalAnswers = quizAnswers) => {
    if(!text.trim()) return;
    setError(null);
    setPhase("loading");
    if(selected && PREBAKED[selected]) {
      await new Promise(res=>setTimeout(res,2000));
      setResult({...PREBAKED[selected], _quiz: finalAnswers, _lead: lead});
      setPhase("results");
      return;
    }
    try {
      const res=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"Content-Type":"application/json","x-api-key":ANTHROPIC_API_KEY,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},body:JSON.stringify({model:"claude-haiku-4-5-20251001",max_tokens:900,system:SYS,messages:[{role:"user",content:`Member situation: ${text}\nMembership status: ${finalAnswers.membershipLabel||"unknown"}\nAdditional context: ${finalAnswers.followupLabel||"none"}`}]})});
      const d=await res.json();
      const raw=(d.content||[]).map(c=>c.text||"").join("");
      const s=raw.indexOf("{"),e=raw.lastIndexOf("}");
      if(s===-1||e===-1)throw new Error("No JSON");
      const parsed=JSON.parse(raw.slice(s,e+1).replace(/[\u0000-\u001F\u007F]/g," ").replace(/,(\s*[}\]])/g,"$1"));
      if(!parsed.products?.length)throw new Error("No products");
      setResult({...parsed, _quiz: finalAnswers, _lead: lead});setPhase("results");
    } catch(e){setError("Something went wrong — please try again.");setPhase("home");}
  };

  return (
    <div style={{minHeight:"100vh",display:"flex",flexDirection:"column",background:"#f7f8fa"}}>
      <style>{`.sc:hover{border-color:${R}!important;box-shadow:0 2px 12px rgba(218,83,44,0.12)!important}textarea:focus{outline:none;border-color:${N}!important}.sc{transition:transform .2s ease,box-shadow .2s ease,border-color .2s ease}.sc:hover{transform:translateY(-2px)}`}</style>
      <header style={{background:"white",borderBottom:"1px solid #e2e5eb",boxShadow:"0 1px 4px rgba(0,0,0,0.05)",position:"sticky",top:0,zIndex:50}}>
        <div style={{padding:"0 40px",display:"flex",alignItems:"center",gap:28,height:56}}>
          <div onClick={goHome} style={{cursor:"pointer"}}><FTLogo/></div>
          <nav style={{display:"flex",alignItems:"center",gap:32,flex:1}}>
            {["Everyday Banking","Loans & Mortgages","Credit Cards","Savings","Membership"].map(l=><span key={l} style={{color:"#0b1220",fontSize:15,cursor:"pointer",whiteSpace:"nowrap"}}>{l}</span>)}
          </nav>
          <div style={{display:"flex",alignItems:"center",gap:20}}>
            <span onClick={goHome} style={{color:"#7c869b",fontSize:13,cursor:"pointer",whiteSpace:"nowrap"}}>✕ Close</span>
            <span style={{color:"#0b1220",fontSize:15,cursor:"pointer",whiteSpace:"nowrap"}}>Log In</span>
            <button style={{background:R,border:"none",borderRadius:24,padding:"8px 22px",color:"white",fontSize:14,fontWeight:600,cursor:"pointer"}}>Join First Tech</button>
          </div>
        </div>
      </header>

      {phase==="loading"&&<Loader situation={text}/>}
      {phase==="quiz"&&<Quiz scenario={selected} step={quizStep} onAnswer={handleQuizAnswer} onBack={quizBack}/>}
      {phase==="lead"&&<LeadCapture lead={lead} onChange={handleLeadChange} onSubmit={handleLeadSubmit} onBack={leadBack} error={leadError}/>}
      {phase==="results"&&result&&<Results data={result} onReset={goHome}/>}
      {phase==="home"&&(
        <>
          <div style={{background:`linear-gradient(160deg,#0b1220 0%,${N} 60%,#1c2a45 100%)`,padding:"56px 24px 52px",textAlign:"center"}}>
            <div style={{display:"inline-flex",alignItems:"center",gap:6,background:"rgba(218,83,44,0.85)",borderRadius:20,padding:"5px 14px",marginBottom:20}}>
              <span style={{color:"white",fontSize:11,fontWeight:700,letterSpacing:"0.08em"}}>✦ PERSONALIZED FOR YOU · FREE</span>
            </div>
            <h1 style={{color:"white",fontSize:42,fontWeight:600,lineHeight:1.15,marginBottom:16,letterSpacing:"-0.02em",fontFamily:"'Space Grotesk',sans-serif"}}>Let's find what's right for you</h1>
            <p style={{color:"rgba(255,255,255,0.6)",fontSize:16,lineHeight:1.65,maxWidth:520,margin:"0 auto 36px",fontWeight:400}}>Every financial situation is different. Tell us a little about yours and we'll show you which First Tech products will help — and exactly how much you could save.</p>
            <div style={{display:"flex",justifyContent:"center",gap:48}}>
              {[["Your money stays yours","No fees, ever"],["People over profit","Member-owned since 1952"],["Federally protected","NCUA insured to $250K"]].map(([t,s])=>(
                <div key={t}><div style={{fontSize:13,fontWeight:600,color:"rgba(255,255,255,0.85)",marginBottom:3}}>{t}</div><div style={{fontSize:12,color:"rgba(255,255,255,0.4)"}}>{s}</div></div>
              ))}
            </div>
          </div>
          <div style={{maxWidth:780,margin:"0 auto",padding:"48px 24px 80px",width:"100%"}}>
            <div style={{fontSize:10,fontWeight:700,letterSpacing:"0.1em",textTransform:"uppercase",color:"#a3abbb",marginBottom:16}}>What Brings You Here?</div>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:36}}>
              {SCENARIOS.map(s=>{
                const active=selected===s.id;
                return (
                  <div key={s.id} className="sc" onClick={()=>handleSelect(s.id)} style={{background:"white",borderRadius:12,padding:"16px 18px",border:active?`1.5px solid ${R}`:"1.5px solid #e2e5eb",boxShadow:active?"0 2px 14px rgba(218,83,44,0.14)":"0 1px 4px rgba(0,0,0,0.04)",display:"flex",alignItems:"flex-start",gap:14,cursor:"pointer",transition:"all 0.15s"}}>
                    <ScenarioIcon d={SCENARIO_ICONS[s.id]}/>
                    <div><div style={{fontSize:14,fontWeight:700,color:active?R:"#0b1220",marginBottom:3}}>{s.label}</div><div style={{fontSize:12.5,color:"#7c869b",lineHeight:1.45}}>{s.desc}</div></div>
                  </div>
                );
              })}
            </div>
            <div style={{fontSize:10,fontWeight:700,letterSpacing:"0.1em",textTransform:"uppercase",color:"#a3abbb",marginBottom:12}}>Or Describe It in Your Own Words</div>
            <textarea value={text} onChange={e=>setText(e.target.value)} placeholder="Tell us about your financial situation — where you bank now, what's not working, and what you're trying to accomplish." rows={4} style={{width:"100%",border:"1.5px solid #cbd1db",borderRadius:12,padding:"16px 18px",fontSize:14,lineHeight:1.65,color:"#0b1220a2e",background:"white",resize:"vertical",fontFamily:"inherit"}}/>
            {error&&<div style={{color:R,fontSize:13,marginTop:8}}>{error}</div>}
            <button onClick={startQuiz} disabled={!text.trim()} style={{width:"100%",marginTop:16,background:text.trim()?R:"#cbd1db",color:"white",border:"none",borderRadius:28,padding:"16px 24px",fontSize:16,fontWeight:600,cursor:text.trim()?"pointer":"not-allowed",boxShadow:text.trim()?"0 4px 20px rgba(218,83,44,0.3)":"none",transition:"all 0.2s"}}>Continue →</button>
            <div style={{textAlign:"center",marginTop:12,fontSize:12,color:"#a3abbb"}}>Two quick questions, then your results · No account needed</div>
          </div>
        </>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);

function moneyCoachReply(q){
  const s = q.toLowerCase();
  if(s.includes('dining')){
    return `You spent **$342** on dining this month, about **$45** above your recent average. Dining is currently **22%** of your total spending — the largest single category after auto & transport.`;
  }
  if(s.includes('vacation') || s.includes('afford')){
    const avail = accounts.find(a=>a.id==='chk').available;
    return `Your Rewards Checking has **$${avail.toLocaleString()}** available. A $2,000 trip would leave about **$${(avail-2000).toLocaleString()}** — comfortable, but I'd keep at least one month of expenses in checking as a buffer.`;
  }
  if(s.includes('credit score') || s.includes('credit')){
    return `Your credit score is **${member.creditScore}** (Good). The fastest lever from here is usually keeping card utilization under **30%** — you're currently at **${Math.round(accounts.find(a=>a.id==='cc').balance/accounts.find(a=>a.id==='cc').limit*100)}%** on Odyssey Rewards.`;
  }
  if(s.includes('auto') || s.includes('car loan')){
    return `Based on your account history, you may pre-qualify for a First Tech auto loan that could beat your current auto payment rate. Checking your rate won't affect your credit score — want me to start that?`;
  }
  if(s.includes('saving') || s.includes('home') || s.includes('down payment')){
    return `You're **${Math.round(member.savingsProgress/member.savingsGoal*100)}%** of the way to your $${member.savingsGoal.toLocaleString()} ${member.savingsGoalLabel} goal. Adding **$150/month** would get you there roughly 3 months faster.`;
  }
  return `Happy to help with that. I can walk through your spending, savings progress, or upcoming payments — what would be most useful to look at first?`;
}

function renderTransfer(){
  const step = state.transferStep;
  let inner = '';
  if(step==='select'){
    inner = `
      <div class="card" style="margin-bottom:14px;">
        <div style="display:flex;gap:10px;">
          <div style="flex:1;background:var(--teal-light);border-radius:14px;padding:12px;text-align:center;cursor:pointer;" onclick="alertPlaceholder()">

            <div style="font-size:11px;font-weight:700;color:var(--teal-dark);margin-top:4px;">Send</div>
          </div>
          <div style="flex:1;background:var(--blue-bg);border-radius:14px;padding:12px;text-align:center;cursor:pointer;" onclick="alertPlaceholder()">
            <div style="color:var(--blue);">${ICONS.arrowDown}</div>
            <div style="font-size:11px;font-weight:700;color:var(--blue);margin-top:4px;">Request</div>
          </div>
          <div style="flex:1;background:var(--purple-bg);border-radius:14px;padding:12px;text-align:center;cursor:pointer;" onclick="alertPlaceholder()">
            <div style="color:var(--purple);">${ICONS.swap}</div>
            <div style="font-size:11px;font-weight:700;color:var(--purple);margin-top:4px;">Between</div>
          </div>
        </div>
      </div>
      <div class="card">
        <div class="card-title" style="margin-bottom:12px;">Frequent Recipients</div>
        ${recipients.map(r=>`
          <div class="acct-row" onclick="pickRecipient('${r.id}')">
            <div class="acct-icon" style="background:var(--teal-light);color:var(--teal-dark);font-weight:700;font-size:12px;">${r.initials}</div>
            <div style="flex:1">
              <div class="acct-name">${r.name}</div>
              <div class="acct-num" style="font-family:inherit;">${r.type}${r.last?` · Last: ${fmtDate(r.last)}`:''}</div>
            </div>
            ${r.fav?`<span style="color:var(--amber)">${ICONS.star}</span>`:''}
            ${ICONS.chevron}
          </div>`).join('')}
      </div>`;
  } else if(step==='amount' && state.transferRecipient){
    const r = state.transferRecipient;
    inner = `
      <div class="card slide-in">
        <div style="text-align:center;margin-bottom:20px;">
          <div class="profile-avatar" style="width:60px;height:60px;font-size:19px;">${r.initials}</div>
          <div style="font-weight:700;">${r.name}</div>
          <div class="muted" style="font-size:12px;">${r.type}</div>
        </div>
        <div style="text-align:center;margin-bottom:20px;">
          <div class="muted" style="font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;margin-bottom:6px;">Amount</div>
          <div style="display:flex;align-items:center;justify-content:center;">
            <span style="font-size:28px;color:#a3abbb;margin-right:2px;">$</span>
            <input id="amountInput" type="number" placeholder="0.00" value="${state.transferAmount}"
              oninput="state.transferAmount=this.value; updateContinueBtn();"
              style="font-size:36px;font-weight:700;width:160px;text-align:center;border:none;background:transparent;outline:none;font-family:inherit;color:var(--ink);">
          </div>

function renderChatPanel(){
  if(!state.chatOpen) return '';
  const suggestions = [
    "How much did I spend on dining last month?",
    "Can I afford a $2,000 vacation in October?",
    "Am I pre-qualified for an auto loan?",
  ];
  return `
  <div class="chat-panel">
    <div class="chat-head">
      <div style="display:flex;align-items:center;gap:10px;">
        <div class="chat-avatar">${ICONS.dollar}</div>
        <div>
          <div style="font-weight:700;font-size:14px;">Money Coach</div>
          <div class="muted" style="font-size:11px;">AI financial guidance · not live support</div>
        </div>
      </div>
      <button class="icon-btn" style="background:#eef0f4;color:var(--ink)" onclick="toggleChat(false)">${ICONS.x}</button>
    </div>
    <div class="chat-body" id="chatBody">
      ${state.chatMessages.length===0 ? `
        <div style="text-align:center;padding:20px 8px;">
          <div style="width:56px;height:56px;border-radius:50%;background:var(--teal-light);display:flex;align-items:center;justify-content:center;margin:0 auto 14px;color:var(--teal-dark);">${ICONS.sparkles}</div>
          <div style="font-weight:800;font-size:16px;margin-bottom:6px;">How can I help today?</div>
          <div class="muted" style="font-size:12.5px;margin-bottom:16px;">Ask about spending, savings, or your accounts.</div>
          ${suggestions.map(s=>`<button class="chat-suggest" onclick="sendChat(${JSON.stringify(s)})">${s}</button>`).join('')}
        </div>` :
        state.chatMessages.map(m=>`<div class="msg ${m.role}">${m.text}</div>`).join('') + (state.chatTyping ? `<div class="msg bot typing"><span class="typing-dot2"></span><span class="typing-dot2"></span><span class="typing-dot2"></span></div>` : '')
      }
    </div>
    <div class="chat-input-row">
      <input id="chatInputEl" class="chat-input" placeholder="Ask about spending, savings, or transfers..." onkeydown="if(event.key==='Enter') submitChat()">
      <button class="chat-send" onclick="submitChat()">${ICONS.send}</button>
    </div>
    <div class="disclaimer">Money Coach offers general guidance, not personalized financial or fiduciary advice.</div>
  </div>`;
}

function renderAlert(){
  if(!state.activeAlert) return '';
  const a = state.activeAlert;
  return `
  <div class="alert-banner">
    <div style="width:36px;height:36px;border-radius:50%;background:${a.color==='amber'?'var(--amber-bg)':'var(--green-bg)'};color:${a.color==='amber'?'var(--amber)':'var(--green)'};display:flex;align-items:center;justify-content:center;flex-shrink:0;">${ICONS[a.icon]}</div>
    <div style="flex:1;">
      <div style="font-weight:700;font-size:13px;">${a.title}</div>
      <div class="muted" style="font-size:11.5px;margin-top:2px;">${a.message}</div>
    </div>
    <button class="icon-btn" style="background:#eef0f4;color:var(--ink);width:24px;height:24px;" onclick="dismissAlert()">${ICONS.x}</button>
  </div>`;
}

function render(){
  const view = document.getElementById('view');
  const overlay = document.getElementById('overlay');
  let body = '';
  if(state.tab==='home') body = renderHome();
  else if(state.tab==='accounts') body = renderAccounts();
  else if(state.tab==='cards') body = renderCards();
  else if(state.tab==='transfer') body = renderTransfer();
  else if(state.tab==='profile') body = renderProfile();

  view.innerHTML = body;

  overlay.innerHTML = `
    <div class="concept-tag">AI Concept Preview</div>
    ${renderAlert()}
    <div class="fab" onclick="toggleChat(true)">
      <div class="fab-icon">${ICONS.dollar}</div>
      <div class="fab-label">Money Coach</div>
    </div>
    ${renderChatPanel()}
  `;

  if(state.chatOpen){
    const cb = document.getElementById('chatBody');
    if(cb) cb.scrollTop = cb.scrollHeight;
  }

  renderNav();
  animateCountUps();
  if(!state.alertsScheduled) scheduleAlerts();
}

function animateCountUps(){
  document.querySelectorAll('.stat-value.mono').forEach(el=>{
    const raw = el.textContent;
    const m = raw.match(/([\d,]+\.?\d*)/);
    if(!m) return;
    const target = parseFloat(m[1].replace(/,/g,''));
    const prefix = raw.slice(0, raw.indexOf(m[1]));
    const suffix = raw.slice(raw.indexOf(m[1]) + m[1].length);
    const decimals = m[1].includes('.') ? m[1].split('.')[1].length : 0;
    const start = performance.now(), dur = 700;
    function tick(now){
      const p = Math.min(1, (now-start)/dur);
      const eased = 1 - Math.pow(1-p, 3);
      el.textContent = prefix + (target*eased).toLocaleString('en-US',{minimumFractionDigits:decimals,maximumFractionDigits:decimals}) + suffix;
      if(p<1) requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);
  });
}

function renderNav(){
  const nav = document.getElementById('bottomNav');
  const items = [
    {id:'home', label:'Home', icon:'home'},
    {id:'accounts', label:'Accounts', icon:'landmark'},
    {id:'cards', label:'Cards', icon:'card'},
    {id:'transfer', label:'Transfer', icon:'swap'},
    {id:'profile', label:'Profile', icon:'user'},
  ];
  nav.innerHTML = items.map(it=>`
    <button class="nav-btn ${state.tab===it.id?'active':''}" onclick="setTab('${it.id}')">
      ${ICONS[it.icon]}
      <span>${it.label}</span>
    </button>`).join('');
}

// ---------- Interaction handlers ----------

function handleNudge(action){
  if(action==='accounts') setTab('accounts');
  else if(action==='cards') setTab('cards');
  else if(action.startsWith('chat:')){
    toggleChat(true);
  } else {
    toggleChat(true);
  }
}

function handleAction(type){
  if(type==='auto_loan'){ toggleChat(true); setTimeout(()=>sendChat('Am I pre-qualified for an auto loan?'),150); }
  else if(type==='card') setTab('cards');
  else if(type==='savings') toggleChat(true);
  else setTab('accounts');
}

function toggleFreeze(cardId){
  const c = cards.find(c=>c.id===cardId);
  c.status = c.status==='active' ? 'frozen' : 'active';
  render();
}

function pickRecipient(id){
  state.transferRecipient = recipients.find(r=>r.id===id);
  state.transferStep = 'amount';
  render();
}

function goConfirm(){
  if(state.transferAmount && parseFloat(state.transferAmount) > 0){
    state.transferStep = 'confirm';
    render();
  }
}

function updateContinueBtn(){
  const btn = document.getElementById('continueBtn');
  if(btn) btn.disabled = !(state.transferAmount && parseFloat(state.transferAmount) > 0);
}

function resetTransfer(){
  state.transferStep = 'select';
  state.transferRecipient = null;
  state.transferAmount = '';
  render();
}

function toggleChat(open){
  state.chatOpen = open;
  render();
}

function sendChat(text){
  state.chatMessages.push({role:'user', text});
  state.chatTyping = true;
  render();
  setTimeout(()=>{
    state.chatTyping = false;
    state.chatMessages.push({role:'bot', text: moneyCoachReply(text).replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>')});
    render();
  }, 700);
}

function submitChat(){
  const el = document.getElementById('chatInputEl');
  const val = el.value.trim();
  if(!val) return;
  el.value = '';
  sendChat(val);
}

function alertPlaceholder(){ /* no-op for demo-only controls (details, sign out, etc.) */ }

function scheduleAlerts(){
  state.alertsScheduled = true;
  setTimeout(()=>{
    if(state.tab==='home' && !state.chatOpen){
      state.activeAlert = { title:'Unusual Spending Detected', message:'Dining spend is 22% higher than usual this week — $118 vs $96 average.', icon:'trendDown', color:'amber' };
      render();
      setTimeout(()=>{ if(state.activeAlert && state.activeAlert.title==='Unusual Spending Detected'){ state.activeAlert=null; render(); } }, 6000);
    }
  }, 7000);
  setTimeout(()=>{
    if(state.tab==='home' && !state.chatOpen){
      state.activeAlert = { title:'Direct Deposit Received', message:'Payroll deposit of $4,250 posted to Rewards Checking.', icon:'dollar', color:'green' };
      render();
      setTimeout(()=>{ if(state.activeAlert && state.activeAlert.title==='Direct Deposit Received'){ state.activeAlert=null; render(); } }, 6000);
    }
  }, 22000);
}

function dismissAlert(){ state.activeAlert = null; render(); }

// init
render();

<script>
  function restore(s){ return s.replace(/@@ENDSCRIPT@@/g, '</scr' + 'ipt>'); }

  const map = { homepage:'frame-homepage', findmyfit:'frame-findmyfit', banking:'frame-banking' };
  Object.keys(map).forEach(key=>{
    const src = document.getElementById('src-' + key).textContent;
    document.getElementById(map[key]).srcdoc = restore(src);
  });

  const btns = document.querySelectorAll('.rail-btn');
  const wraps = document.querySelectorAll('.frame-wrap');

  function switchScreen(key){
    if(!map[key]) return;
    btns.forEach(b=>b.classList.toggle('active', b.dataset.screen===key));
    wraps.forEach(w=>w.classList.toggle('active', w.dataset.screen===key));
  }

  btns.forEach(btn=>{
    btn.addEventListener('click', ()=> switchScreen(btn.dataset.screen));
  });

  // Embedded screens (e.g. the homepage's "Find My Fit" module) can hand off
  // navigation to this viewer via postMessage rather than reaching outside their own iframe.
  window.addEventListener('message', (event) => {
    if(event.data && event.data.type === 'switchScreen'){
      switchScreen(event.data.screen);
    }
  });

  // ---------- Defensive layout/dedup guards ----------
  // The rail is now fixed-positioned rather than a flex sibling, so size the
  // stage against its *actual* rendered height (safe-area insets vary by device)
  // instead of relying on flex reflow timing.
  const railEl = document.querySelector('.bottom-rail');
  const stageEl = document.querySelector('.stage');
  function sizeStage(){
    stageEl.style.bottom = railEl.offsetHeight + 'px';
  }
  sizeStage();
  window.addEventListener('resize', sizeStage);

  // Self-healing guard: if anything ever causes a second .bottom-rail to be
  // inserted into the document, remove the extras immediately and keep the
  // first as the single source of truth.
  function dedupeRail(){
    const rails = document.querySelectorAll('.bottom-rail');
    for(let i = 1; i < rails.length; i++) rails[i].remove();
  }
  dedupeRail();
  new MutationObserver(dedupeRail).observe(document.body, { childList: true, subtree: false });
</script>
