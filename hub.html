<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>First Tech — Prototype Hub</title>
<style>
  :root {
    --nav-bg: #000000;
    --nav-height: 76px;
    --nav-active: #26262a;
    --nav-icon-inactive: #8a8a90;
    --nav-icon-active: #ffffff;
    --font-main: 'Proxima Nova', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    height: 100%;
    font-family: var(--font-main);
    background: #fff;
    overflow: hidden;
  }

  .view-stack {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: var(--nav-height);
  }

  .view {
    position: absolute;
    inset: 0;
    display: none;
  }

  .view.is-active {
    display: block;
  }

  .view iframe {
    width: 100%;
    height: 100%;
    border: 0;
    display: block;
  }

  .view__loading {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #9a9a9a;
    font-size: 14px;
    letter-spacing: 0.02em;
  }

  .bottom-nav {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    height: var(--nav-height);
    background: var(--nav-bg);
    display: flex;
    align-items: center;
    justify-content: space-around;
    padding: 0 12px;
    z-index: 100;
  }

  .nav-btn {
    appearance: none;
    background: none;
    border: none;
    cursor: pointer;
    display: flex;
    flex-direction: row;
    align-items: center;
    gap: 8px;
    padding: 10px 22px;
    border-radius: 20px;
    color: var(--nav-icon-inactive);
    font-family: inherit;
    font-size: 13px;
    letter-spacing: 0.02em;
    transition: background 0.15s ease, color 0.15s ease;
  }

  .nav-btn svg {
    stroke: var(--nav-icon-inactive);
    transition: stroke 0.15s ease;
  }

  .nav-btn.is-active {
    background: var(--nav-active);
    color: var(--nav-icon-active);
  }

  .nav-btn.is-active svg {
    stroke: var(--nav-icon-active);
  }

  .nav-btn:hover:not(.is-active) {
    color: #c7c7cc;
  }

  .nav-btn:hover:not(.is-active) svg {
    stroke: #c7c7cc;
  }
</style>
</head>
<body>

<div class="view-stack" id="viewStack">
  <div class="view is-active" data-view="site">
    <div class="view__loading">Loading…</div>
  </div>
  <div class="view" data-view="fit">
    <div class="view__loading">Loading…</div>
  </div>
  <div class="view" data-view="ai">
    <div class="view__loading">Loading…</div>
  </div>
</div>

<nav class="bottom-nav">
  <button type="button" class="nav-btn is-active" data-target="site">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10v9.5a1 1 0 0 0 1 1H9.5v-6h5v6H17.5a1 1 0 0 0 1-1V10"/></svg>
    <span>Homepage</span>
  </button>
  <button type="button" class="nav-btn" data-target="fit">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M10.5 7.5v6M7.5 10.5h6"/><path d="M15.5 15.5 20 20"/></svg>
    <span>Find My Fit</span>
  </button>
  <button type="button" class="nav-btn" data-target="ai">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="6.5" y="2.5" width="11" height="19" rx="2.5"/><path d="M10.25 18.5h3.5"/></svg>
    <span>AI Banking</span>
  </button>
</nav>

<script>
  var SOURCES = {
    site: 'index.html',
    fit: 'find my loan/index.html',
    ai: 'iphone-preview.html'
  };

  var views = document.querySelectorAll('.view');
  var buttons = document.querySelectorAll('.nav-btn');

  function activate(target) {
    views.forEach(function (view) {
      var isMatch = view.getAttribute('data-view') === target;
      view.classList.toggle('is-active', isMatch);
      if (isMatch && !view.querySelector('iframe')) {
        var iframe = document.createElement('iframe');
        iframe.src = SOURCES[target];
        iframe.title = target;
        view.innerHTML = '';
        view.appendChild(iframe);
      }
    });
    buttons.forEach(function (btn) {
      btn.classList.toggle('is-active', btn.getAttribute('data-target') === target);
    });
  }

  buttons.forEach(function (btn) {
    btn.addEventListener('click', function () {
      activate(btn.getAttribute('data-target'));
    });
  });

  activate('site');
</script>

</body>
</html>
